name: Deploy to GitHub Pages

# Tag-triggered, not push-triggered: a tag is a deliberate "this is a release"
# marker, and every deploy here ends up world-visible at a fixed URL. Match
# this pattern if you use a different tag scheme (this repo has none yet).
#
# workflow_dispatch is here too, for re-running a deploy (a Pages outage, a
# GitHub Actions incident) without having to cut a new tag just to retry one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment in flight at a time. `cancel-in-progress: false`
# on purpose -- an in-progress deploy finishes rather than being cut off
# half-published; a second tag pushed moments later just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Third-party OpenArena assets (GPLv2, freely redistributable -- see
      # NOTICE) are never committed; every clean checkout fetches them fresh.
      # Before the test gate, not after: three of the opt-in real-map suites
      # (de4th_run1/2, acc_fuzzle) fetch their own .pk3 through this same
      # manifest and only skip gracefully when a file is truly unfetchable
      # (retail Quake III content, which stays local by design -- see NOTICE)
      # -- run test first and these fail outright instead of skipping.
      - name: Fetch third-party assets
        run: npm run download-assets

      - name: Fidelity and behaviour gate
        # A tag is a release. Nothing gets published to a public URL without
        # passing exactly what a local `npm test` would demand first.
        run: npm test

      # `maps/ob_basics.bsp` is this project's OWN map, committed at the repo
      # root (see .gitignore's `!/maps/*.bsp`) because compiling a .map needs
      # a Quake III map compiler this workflow does not have. build-oapak
      # only ever reads it from public/maps/ -- the same place a local
      # "compile it yourself and place the result there" step would leave it.
      - name: Place the tutorial course's compiled map
        run: |
          mkdir -p public/maps
          cp maps/ob_basics.bsp public/maps/ob_basics.bsp

      - name: Build the bundled OpenArena kit
        run: |
          npm run build-oapak
          npm run build-startpak

      - name: Build the site
        # BASE_PATH matches vite.config.ts's own default of "/" everywhere
        # else -- only a GitHub Pages *project* site (served from
        # /<repo>/, not a custom domain or a user/org root page) needs this.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
