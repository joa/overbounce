<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overbounce</title>
    <!--
      The real mark, from `design/favicon.png` and its small cut (copied into
      public/ because design/ is not served). Two sizes because a browser tab
      draws it at 16-32px and downscaling the 256 there loses the arc; the
      large one is what a bookmark bar or an installed icon picks up.

      It replaces an inline data: URI placeholder, and the reason that
      placeholder existed still has to hold: WITHOUT any icon
      the browser requests /favicon.ico, vite 404s it, and `npm run shot`
      reported that 404 on EVERY screenshot and exited non-zero through its
      own error gate -- so the gate that exists to catch a WGSL compile
      failure was permanently red and therefore ignored. A file that is
      actually there is a 200, which is just as quiet.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <!-- Tokens and @font-face live here, not imported from main.ts, so they are
         in place before the first paint -- Vite hot-injects JS-imported CSS
         after the script starts running, which is late enough to flash the
         system font. -->
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ob-background);
        font-family: var(--ob-font-mono);
        color: var(--ob-text);
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        place-content: center;
        padding: 2rem;
        background: #101014;
        line-height: 1.6;
      }
      #fatal.show {
        display: grid;
      }
      #fatal h1 {
        font-size: 1.1rem;
        color: #ff6b6b;
        margin-bottom: 0.75rem;
      }
      #fatal p {
        max-width: 60ch;
        color: #a0a0aa;
        font-size: 0.85rem;
      }
      #fatal code {
        color: #e8e8ec;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="fatal">
      <div>
        <h1 id="fatal-title">Failed to start</h1>
        <p id="fatal-body"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
